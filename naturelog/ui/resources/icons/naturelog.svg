<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a9a63"/>
      <stop offset="1" stop-color="#15523d"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7ea"/>
      <stop offset="1" stop-color="#e9e0c6"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2f8a55"/>
      <stop offset="1" stop-color="#6cc46a"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- topographic contours -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="10">
    <path d="M64 300 C 250 240, 380 330, 560 270 S 860 200, 960 250"/>
    <path d="M64 640 C 220 590, 330 690, 500 650 S 820 560, 960 610"/>
    <path d="M64 760 C 240 720, 360 800, 540 770 S 840 700, 960 740"/>
  </g>
  <!-- GPS track -->
  <path d="M170 830 C 250 700, 330 900, 470 800" fill="none" stroke="#fbf7ea"
        stroke-opacity="0.85" stroke-width="22" stroke-linecap="round" stroke-dasharray="2 46"/>
  <circle cx="170" cy="830" r="26" fill="#fbf7ea" fill-opacity="0.85"/>
  <!-- pin shadow -->
  <ellipse cx="560" cy="805" rx="80" ry="20" fill="#000000" fill-opacity="0.22"/>
  <!-- pin -->
  <path d="M560 795 C 500 700, 350 570, 350 420 A 210 210 0 1 1 770 420 C 770 570, 620 700, 560 795 Z"
        fill="url(#pin)"/>
  <!-- leaf -->
  <path d="M460 520 C 430 400, 510 300, 665 305 C 680 455, 590 535, 460 520 Z" fill="url(#leaf)"/>
  <path d="M440 545 L 470 512 C 530 450, 580 400, 630 345" fill="none" stroke="#e9f5df"
        stroke-width="16" stroke-linecap="round"/>
  <g fill="none" stroke="#e9f5df" stroke-width="9" stroke-linecap="round" stroke-opacity="0.9">
    <path d="M520 455 L 520 395"/>
    <path d="M520 455 L 585 455"/>
    <path d="M570 400 L 570 355"/>
    <path d="M570 400 L 615 402"/>
  </g>
</svg>
