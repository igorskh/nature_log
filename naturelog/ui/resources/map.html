<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>/*LEAFLET_CSS*/</style>
<style>
  html, body, #map { height: 100%; margin: 0; }
  #hint {
    position: absolute; inset: 0; z-index: 1000; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    font: 15px system-ui, sans-serif; color: #333;
  }
  .media-icon {
    width: 28px; height: 28px; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    background: #fff; border: 2px solid #1971c2; border-radius: 7px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
  }
  .media-icon { color: #1971c2; }
  .media-icon.file { border-color: #5c636a; color: #5c636a; }
  .media-icon.selected { border-color: #2f9e44; color: #2f9e44; background: #ebfbee; border-width: 3px; }
  .media-icon svg { width: 18px; height: 18px; }
  .media-cluster {
    width: 34px; height: 34px; box-sizing: border-box; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font: bold 13px system-ui, sans-serif; color: #fff;
    background: #1971c2; border: 3px solid #fff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
  }
  .media-cluster.selected { background: #2f9e44; }
  #hint span {
    background: rgba(255, 255, 255, 0.92); padding: 14px 22px;
    border: 2px dashed #8a8a8a; border-radius: 10px;
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="hint"><span>Drop a GPX or NMEA file here, or use “Open GPS log…”</span></div>
<script>/*LEAFLET_JS*/</script>
<script>
  const map = L.map('map', { preferCanvas: true }).setView([20, 0], 2);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  L.control.scale().addTo(map);

  let trackLayer = null;
  let marker = null;
  const mediaLayer = L.layerGroup().addTo(map);

  const GLYPHS = {
    image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/>' +
      '<circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
    file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 ' +
      '2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>'
  };
  function mediaIcon(kind, selected) {
    const glyph = GLYPHS[kind] ? kind : 'file';
    return L.divIcon({
      className: '', iconSize: [28, 28], iconAnchor: [14, 14], tooltipAnchor: [14, 0],
      html: `<div class="media-icon ${glyph}${selected ? ' selected' : ''}">${GLYPHS[glyph]}</div>`
    });
  }
  function clusterIcon(count, selected) {
    return L.divIcon({
      className: '', iconSize: [34, 34], iconAnchor: [17, 17], tooltipAnchor: [17, 0],
      html: `<div class="media-cluster${selected ? ' selected' : ''}">${count}</div>`
    });
  }

  function escapeHtml(text) {
    return text.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;',
                                             '"': '&quot;', "'": '&#39;' }[c]));
  }

  // Markers closer than this many screen pixels are merged into a cluster.
  const CLUSTER_RADIUS = 30;
  const CLUSTER_TOOLTIP_LINES = 8;
  let mediaItems = [];

  // Greedy grid clustering at the current zoom; selected and unselected
  // markers are clustered separately so selected ones stay green and on top.
  function cluster(items) {
    const zoom = map.getZoom();
    const cells = new Map();
    const clusters = [];
    for (const item of items) {
      const p = map.project([item.lat, item.lon], zoom);
      const cx = Math.floor(p.x / CLUSTER_RADIUS), cy = Math.floor(p.y / CLUSTER_RADIUS);
      let target = null;
      for (let dx = -1; dx <= 1 && !target; dx++) {
        for (let dy = -1; dy <= 1 && !target; dy++) {
          for (const c of cells.get(`${cx + dx},${cy + dy}`) || []) {
            if (c.point.distanceTo(p) <= CLUSTER_RADIUS) { target = c; break; }
          }
        }
      }
      if (target) { target.items.push(item); continue; }
      const c = { point: p, items: [item] };
      clusters.push(c);
      const key = `${cx},${cy}`;
      if (!cells.has(key)) { cells.set(key, []); }
      cells.get(key).push(c);
    }
    return clusters;
  }

  function drawMediaMarkers() {
    mediaLayer.clearLayers();
    for (const selected of [false, true]) {
      const zIndexOffset = selected ? 2000 : 1000;
      for (const c of cluster(mediaItems.filter(item => !!item.selected === selected))) {
        if (c.items.length === 1) {
          const item = c.items[0];
          L.marker([item.lat, item.lon], { icon: mediaIcon(item.kind, selected), zIndexOffset })
            .bindTooltip(escapeHtml(item.label).replace(/\n/g, '<br>'))
            .addTo(mediaLayer);
          continue;
        }
        const bounds = L.latLngBounds(c.items.map(item => [item.lat, item.lon]));
        const names = c.items.slice(0, CLUSTER_TOOLTIP_LINES)
          .map(item => escapeHtml(item.label.split('\n')[0]));
        if (c.items.length > CLUSTER_TOOLTIP_LINES) {
          names.push(`… and ${c.items.length - CLUSTER_TOOLTIP_LINES} more`);
        }
        L.marker(bounds.getCenter(), { icon: clusterIcon(c.items.length, selected), zIndexOffset })
          .bindTooltip(`<b>${c.items.length} files</b><br>${names.join('<br>')}`)
          .on('click', () => {
            // Zoom in until the cluster splits (files at one spot stay clustered at max zoom).
            const zoom = Math.max(map.getBoundsZoom(bounds.pad(0.3)), map.getZoom() + 1);
            map.flyTo(bounds.getCenter(), Math.min(zoom, map.getMaxZoom()));
          })
          .addTo(mediaLayer);
      }
    }
  }
  map.on('zoomend', drawMediaMarkers);

  // items: [{lat, lon, kind: 'image' | 'file', label, selected}, ...]
  function setMediaMarkers(items) {
    mediaItems = items;
    drawMediaMarkers();
    // Bring the selected files into view (without zooming in).
    const points = items.filter(item => item.selected).map(item => [item.lat, item.lon]);
    if (!points.length) { return; }
    const bounds = L.latLngBounds(points);
    if (!map.getBounds().contains(bounds)) {
      if (points.length === 1) { map.panTo(points[0]); }
      else { map.fitBounds(bounds, { padding: [40, 40], maxZoom: map.getZoom() }); }
    }
  }

  // tracks: [{name, color, segments: [[[lat, lon], ...], ...]}, ...]
  let trackLines = [];
  function setTracks(tracks, fit) {
    if (trackLayer) { trackLayer.remove(); trackLayer = null; }
    trackLines = [];
    if (!tracks.length) {
      clearPosition();
      document.getElementById('hint').style.display = '';
      return;
    }
    trackLayer = L.featureGroup().addTo(map);
    const end = { radius: 5, weight: 2, color: '#fff', fillOpacity: 1 };
    for (const track of tracks) {
      const name = escapeHtml(track.name);
      const line = L.polyline(track.segments, { color: track.color, weight: 3, opacity: 0.9 })
        .bindTooltip(name, { sticky: true }).addTo(trackLayer);
      trackLines.push(line);
      const first = track.segments[0][0];
      const lastSegment = track.segments[track.segments.length - 1];
      const last = lastSegment[lastSegment.length - 1];
      L.circleMarker(first, { ...end, fillColor: '#2f9e44' }).bindTooltip(`${name} – start`).addTo(trackLayer);
      L.circleMarker(last, { ...end, fillColor: '#212529' }).bindTooltip(`${name} – end`).addTo(trackLayer);
    }
    if (fit) { map.fitBounds(trackLayer.getBounds(), { padding: [30, 30] }); }
    if (marker) { marker.bringToFront(); }
    document.getElementById('hint').style.display = 'none';
  }

  // Emphasise the tracks at these indices (none: all drawn normally) and zoom to them.
  function highlightTracks(indices) {
    trackLines.forEach((line, i) => {
      const on = indices.includes(i);
      line.setStyle({ weight: on ? 6 : 3, opacity: indices.length && !on ? 0.4 : 0.9 });
      if (on) { line.bringToFront(); }
    });
    const lines = trackLines.filter((_, i) => indices.includes(i));
    if (lines.length) {
      map.fitBounds(L.featureGroup(lines).getBounds(), { padding: [30, 30] });
    }
    if (marker) { marker.bringToFront(); }
  }

  function clearAll() {
    if (trackLayer) { trackLayer.remove(); trackLayer = null; }
    trackLines = [];
    clearPosition();
    mediaItems = [];
    mediaLayer.clearLayers();
    document.getElementById('hint').style.display = '';
  }

  function setPosition(lat, lon) {
    if (!marker) {
      marker = L.circleMarker([lat, lon], {
        radius: 8, weight: 3, color: '#fff', fillColor: '#1971c2', fillOpacity: 1
      }).addTo(map);
    } else {
      marker.setLatLng([lat, lon]);
    }
    marker.bringToFront();
  }

  function clearPosition() {
    if (marker) { marker.remove(); marker = null; }
  }
</script>
</body>
</html>
